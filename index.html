<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Doughboard</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            canvas, canvas * {
                touch-action: none; /* prevents gestures */
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            #menu {
                position: absolute;
                margin: 2px;
                padding: 3px;
                bottom: 0;
                left: 0;
                background-color: #22222290;
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            #menu * {
                font-family: monospace;
                font-size: large;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            #menu-list {
                margin: 4px;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            #menu-list div {
                display: flex;
                gap: 4px;
            }
            #menu label {
                color: white;
                min-width: 10em;
            }
            #menu p {
                margin: 2px 6px;
            }
            #menu p, #menu a {
                color: lightgrey;
                font-size: medium;
            }
            #menu-buttons {
                display: flex;
                gap: 2px;
            }
            #menu-buttons button {
                font-size: large;
                font-family: monospace;
                border: none;
                height: 26px;
                border-radius: 13px;
                padding: 0px 8px;
            }
        </style>
    </head>
    <body>
        <canvas id="gl_canvas" width="0" height="0"></canvas>
        <script type="module" src="shader.js"></script>
        <div id="menu">
            <p id="intro_text">click canvas once to start audio.</p>
            <div id="menu-list"></div>
            <p id="about-text" style="margin-bottom: 8px !important;">
                <a href="https://github.com/noacubestudio/doughboard/">view source</a>. made with <a href="https://dough.strudel.cc/">dough</a>
            </p>
            <div id="menu-buttons"></div>
        </div>
    </body>
</html>
