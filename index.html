<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Doughboard</title>
        <style>
            :root {
                --main-bg-color: rgb(60, 50, 66)
            }
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: var(--main-bg-color);
            }
            canvas, canvas * {
                touch-action: none; /* prevents gestures */
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            #intro-text {
                display: block;
                position: absolute;
                top: 50vh;
                left: 50vw;
                color: white;
                font-size: 15px;
                font-family: monospace;
                transform: translate(-50%, -50%);
            }
            #menu {
                position: absolute;
                margin: 2px;
                padding: 3px;
                top: 0;
                left: 0;
                background-color: #22222290;
                border-radius: 13px;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            #menu * {
                font-family: monospace;
                font-size: 17px;
                touch-action: pan-y;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            #menu-list {
                padding: 0px 6px 4px;
                display: grid;
                grid: auto-flow / auto auto;
                gap: 4px;
                overflow-y: scroll;
                max-height: 60vh;
            }
            @media screen and (orientation: portrait) {
                #menu-list {
                    grid: auto-flow / auto;
                }
            }
            .label-group {
                display: flex;
                color: white;
                gap: 12px;
            }
            .label-param {
                color: lightgray;
                flex-grow: 1;
            }
            .label-value {
                text-align: right;
                min-width: 4ch;
            }
            #menu p {
                margin: 4px 6px;
                color: lightgrey;
            }
            #menu .smaller-text, #menu .smaller-text a {
                color: lightgrey;
                font-size: 15px;
            }
            #menu-buttons {
                display: flex;
                gap: 4px;
            }
            #menu-buttons button {
                font-size: inherit;
                font-family: monospace;
                border: none;
                height: 30px;
                border-radius: 10px;
                padding: 0px 8px;
                background-color: #333;
                color: white;
            }
            #menu-buttons button:hover, #menu-buttons button:active {
                background-color: #444;
            }
        </style>
    </head>
    <body>
        <canvas id="gl_canvas" width="0" height="0"></canvas>
        <script type="module" src="main.js"></script>
        <div id="menu">
            <div id="menu-top" style="display: flex; flex-direction: column;">
                <div id="menu-buttons"></div>
                <p id="playing-pitches" class="smaller-text">-</p>
            </div>
            <div id="menu-list"></div>
            <p class="smaller-text" id="about-text" style="margin-bottom: 8px !important;">
                made by <a href="http://noacubestudio.github.io">noa</a>, sound from <a href="https://dough.strudel.cc/">dough</a>, <a href="https://github.com/noacubestudio/doughboard/">view source</a> 
            </p>
        </div>
        <p id="intro-text">click canvas to start audio.</p>
    </body>
</html>
